name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: auditrail_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/auditrail_e2e
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/auditrail_e2e

    steps:
      - uses: actions/checkout@v4

      # API is maintained in a separate repository.
      # If it is private, configure API_REPO_TOKEN in this repository's secrets.
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/auditrail-api
          path: api
          token: ${{ secrets.API_REPO_TOKEN || github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            api/package-lock.json

      - name: API - install, migrate, seed, build and start
        working-directory: api
        env:
          NODE_ENV: test
          PORT: 4000
          JWT_SECRET: e2e-secret-e2e-secret-e2e-secret-123456
          APP_URL: http://localhost:3000
          CORS_ORIGIN: http://localhost:3000
          DEMO_LOGIN_EMAIL: demo@payflow.test
        run: |
          set -e

          npm ci
          npx prisma validate
          npx prisma generate
          npx prisma migrate deploy
          npm run e2e:seed
          npm run build

          nohup node dist/index.js > ../api.log 2>&1 &

          for i in $(seq 1 30); do
            if curl -sf http://localhost:4000/health; then
              break
            fi
            sleep 1
          done

          if ! curl -sf http://localhost:4000/health; then
            echo "API failed to start. API log:"
            cat ../api.log
            exit 1
          fi

          if ! curl -sf http://localhost:4000/health/db; then
            echo "API database health check failed. API log:"
            cat ../api.log
            exit 1
          fi

      - name: Frontend - install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build frontend
        run: npm run build
        env:
          API_URL: http://localhost:4000

      - name: Run Playwright E2E tests
        run: npx playwright test

      - name: Upload E2E debug artifacts
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-debug
          path: |
            playwright-report
            test-results
            api.log
          retention-days: 7
